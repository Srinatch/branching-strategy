apiVersion: apps/v1
kind: Deployment
metadata:
  name: chess-app
  namespace: chess

spec:
  replicas: 2

  selector:
    matchLabels:
      app: chess

  template:
    metadata:
      labels:
        app: chess

    spec:
      containers:
      - name: chess-app
        image: your-image
        imagePullPolicy: Always

        ports:
        - containerPort: 9091

        # ✅ REQUIRED for HPA
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"

        # ✅ FIXED (moved inside container)
        livenessProbe:
          httpGet:
            path: /
            port: 9091
          initialDelaySeconds: 10
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /
            port: 9091
          initialDelaySeconds: 5
          periodSeconds: 5