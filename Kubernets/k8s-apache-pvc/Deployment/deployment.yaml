apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache-deploy
  namespace: apache-prod
  labels:
    app: apache
spec:
  replicas: 2

  minReadySeconds: 10   # Pod must be ready for 10s before considered available

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  selector:
    matchLabels:
      app: apache

  template:
    metadata:
      labels:
        app: apache

    spec:
      containers:
      - name: apache
        image: httpd:2.4

        ports:
        - containerPort: 80

        # Resource Management
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"

        # Health Checks
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5

        # Persistent Storage Mount
        volumeMounts:
        - name: apache-storage
          mountPath: /usr/local/apache2/htdocs

      volumes:
      - name: apache-storage
        persistentVolumeClaim:
          claimName: apache-pvc